# PostgreSQL configuration for Accio Preço
default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: <%= ENV.fetch("DATABASE_USERNAME", "postgres") %>
  password: <%= ENV.fetch("DATABASE_PASSWORD", "password") %>
  host: <%= ENV.fetch("DATABASE_HOST", "127.0.0.1") %>
  port: <%= ENV.fetch("DATABASE_PORT", 5434) %>

development:
  <<: *default
  database: accio_preco_development

test:
  <<: *default
  database: accio_preco_test

production:
  <<: *default
  database: accio_preco_production
  username: <%= ENV.fetch("DATABASE_USERNAME", "accio_preco") %>
  password: <%= ENV["ACCIO_PRECO_DATABASE_PASSWORD"] %>
  host: <%= ENV.fetch("DATABASE_HOST", "localhost") %>
  port: <%= ENV.fetch("DATABASE_PORT", 5432) %>
